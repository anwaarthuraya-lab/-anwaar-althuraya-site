<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة أنوار الثريا للتجارة | Anwaar Althuraya Trading Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a3a5c;
  --navy-dark:#052840;
  --navy-mid:#0f4d76;
  --orange:#f19323;
  --gold:#fcb92d;
  --red:#ee4947;
  --amber:#fcb92d;
  --blue2:#0d66ac;
  --ink:#1c2733;
  --ink-soft:#5b6a7a;
  --paper:#f6f8fa;
  --line:#e1e6ec;
  --white:#ffffff;
  --brand: var(--navy);
  --radius: 10px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
html[dir="ltr"] body{ font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif; }

/* language toggling */
body.lang-en [data-ar]{ display:none !important; }
body.lang-ar [data-en]{ display:none !important; }

h1,h2,h3,h4{ margin:0; font-weight:700; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
img{max-width:100%;display:block;}

.wrap{ max-width:1180px; margin-inline:auto; padding-inline:24px; }

/* ---------- ICON SPRITE ---------- */
.ic{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; display:block; }

/* ---------- HEADER ---------- */
header{
  position:sticky; top:0; z-index:100;
  background:rgba(11,42,74,0.97);
  backdrop-filter:blur(6px);
  color:var(--white);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.header-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding-block:14px;
  gap:16px;
}
.brand-mark{ display:flex; align-items:center; gap:12px; }
.logo-diamond{ width:38px; height:38px; flex:none; }
.brand-name{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; font-size:15px; font-weight:700; line-height:1.3; }
.brand-name span,
.brand-name small{ display:block; }
.brand-name small{ font-weight:500; font-size:11px; letter-spacing:.02em; color:#b9c7d8; }

nav.main-nav{ display:flex; align-items:center; gap:22px; }
nav.main-nav a{ font-size:14px; color:#dbe4ee; white-space:nowrap; padding-block:4px; border-bottom:2px solid transparent; transition:border-color .2s, color .2s; }
nav.main-nav a:hover{ color:#fff; border-color:var(--gold); }

.lang-toggle{
  display:flex; align-items:center; background:rgba(255,255,255,0.08); border-radius:999px; padding:3px; gap:2px;
  flex:none;
}
.lang-toggle button{
  border:none; background:transparent; color:#cfdbe8; font-family:inherit; font-size:13px; font-weight:600;
  padding:7px 14px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:background .2s, color .2s;
}
.lang-toggle button.active{ background:var(--white); color:var(--navy); }
.lang-toggle .flag{ font-size:15px; line-height:1; }

.nav-toggle-btn{ display:none; background:none; border:none; color:#fff; width:34px; height:34px; cursor:pointer; }

@media (max-width: 900px){
  nav.main-nav{
    position:absolute; inset-inline:0; top:100%;
    background:var(--navy-dark); flex-direction:column; align-items:stretch;
    padding:10px 24px 18px; gap:2px; display:none;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav.main-nav.open{ display:flex; }
  nav.main-nav a{ padding-block:10px; border-bottom:1px solid rgba(255,255,255,0.06); }
  .nav-toggle-btn{ display:block; }
}

/* ---------- HERO / ABOUT ---------- */
.hero{
  position:relative; overflow:hidden;
  background:var(--navy);
  color:var(--white);
}
.hero-diagonal{
  position:absolute; inset:0;
  background:linear-gradient(160deg,#123a63 0%, #0b2a4a 60%);
  overflow:hidden;
}
.hero-diagonal svg{ position:absolute; inset:0; width:100%; height:100%; opacity:.35; }
.hero-inner{ position:relative; display:grid; grid-template-columns: auto 1fr; gap:40px; padding-block:76px 64px; align-items:center; }
.hero-badge{ width:96px; height:96px; }
.hero-copy{ padding-inline-start:8px; }
.eyebrow{ font-size:13px; letter-spacing:.04em; color:#a9d1ff; font-weight:600; margin-bottom:10px; }
.hero-copy h1{ font-size:clamp(30px,4vw,44px); line-height:1.25; margin-bottom:22px; }
.hero-copy p{ font-size:16.5px; color:#d7e2ef; margin-bottom:14px; max-width:60ch; }
@media (max-width: 860px){
  .hero{ min-height:auto; padding-block:0; }
  .hero-inner{ grid-template-columns:1fr; padding-block:28px 40px; text-align:center; }
  .hero-badge-wrap{ margin-inline:auto; }
  .hero-stats{ justify-content:center; }
}
@media (max-width: 430px){
  .wrap{ padding-inline:16px; }
  .header-inner{ padding-block:10px; }
  .brand-mark{ gap:8px; }
  .logo-diamond{ width:32px; height:32px; }
  .brand-name{ font-size:12.6px; }
  .brand-name small{ font-size:9px; }
  .hero-copy h1{ font-size:clamp(26px,8vw,34px); }
  .hero-copy p{ font-size:14px; }
  .section-head h2{ font-size:clamp(22px,7vw,28px); }
  .section{ padding-block:46px; }
  .mini-icon-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .mini-icon{ padding:16px 10px; }
  .mini-icon span{ font-size:12px; }
  .gallery-item figcaption{ font-size:10.5px; }
}

/* ---------- SECTION SHELL ---------- */
section{ padding-block:64px; }
.section-head{ margin-bottom:34px; max-width:70ch; }
.section-head .kicker{ font-size:13px; font-weight:600; color:var(--orange); letter-spacing:.03em; margin-bottom:8px; }
.section-head h2{ font-size:clamp(24px,3vw,32px); color:var(--navy); }
.section-dark{ background:var(--navy); color:#fff; }
.section-dark .section-head h2{ color:#fff; }
.section-alt{ background:var(--white); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

/* ---------- MISSION / VISION ---------- */
.mv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.mv-card{ border-radius:var(--radius); padding:32px; }
.mv-card.mission{ background:var(--navy); color:#fff; }
.mv-card.vision{ background:#eef1f5; color:var(--ink); }
.mv-card .ic{ width:34px; height:34px; margin-bottom:16px; }
.mv-card h3{ font-size:20px; margin-bottom:14px; }
.mv-card p{ font-size:15px; opacity:.92; }
@media (max-width:760px){
  .mv-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .mv-card{ padding:18px 12px; }
  .mv-card .ic{ width:28px; height:28px; margin-bottom:10px; }
  .mv-card h3{ font-size:17px; margin-bottom:8px; }
  .mv-card p{ font-size:12px; line-height:1.8; }
}

/* ---------- VALUES ---------- */
.values-row{ display:grid; grid-template-columns:repeat(6,1fr); gap:18px; }
@media (max-width:900px){ .values-row{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:520px){
  .values-row{
   display:grid;
   grid-template-columns:repeat(6,minmax(0,1fr));
   gap:2px;
   overflow:visible;
   padding-bottom:0;
  }
  .value-item{
   min-width:0;
   gap:6px;
  }
  .value-item .diamond{ width:34px; height:34px; border-radius:4px; }
  .value-item .diamond .ic{ width:17px; height:17px; }
  .value-item span{ font-size:9px; line-height:1.35; }
}
.value-item{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; }
.diamond{
  width:64px; height:64px; background:var(--navy); position:relative;
  transform:rotate(45deg); display:flex; align-items:center; justify-content:center; border-radius:8px;
  flex:none;
}
.diamond .ic{ transform:rotate(-45deg); color:#fff; width:28px; height:28px; }
.value-item span{ font-size:13.5px; font-weight:600; color:var(--ink); }

/* ---------- ECOSYSTEM ---------- */
.eco-cols{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:44px; }
@media (max-width:860px){ .eco-cols{ grid-template-columns:1fr; gap:14px; } }
.eco-col{
  position:relative; overflow:hidden; background:linear-gradient(145deg,#fff 0%,#f7f9fc 100%);
  border:1px solid #dbe3ec; border-top:4px solid var(--orange); border-radius:14px; padding:24px;
  box-shadow:0 10px 24px rgba(10,58,92,.07);
}
.eco-col:nth-child(2){ border-top-color:var(--blue2); }
.eco-col:nth-child(3){ border-top-color:var(--gold); }
.eco-col-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid #e8edf3; }
.eco-col-head .ic{ color:var(--orange); width:28px; height:28px; }
.eco-col:nth-child(2) .eco-col-head .ic{ color:var(--blue2); }
.eco-col:nth-child(3) .eco-col-head .ic{ color:#d99a00; }
.eco-col-head h3{ font-size:16.5px; color:var(--navy); }
.eco-chip{ background:rgba(255,255,255,.8); border:1px solid #dbe3ec; border-radius:10px; padding:12px 14px; margin-bottom:10px; transition:border-color .2s, transform .2s, box-shadow .2s; }
.eco-chip:hover{ border-color:var(--orange); transform:translateY(-2px); box-shadow:0 6px 14px rgba(10,58,92,.08); }
.eco-chip:last-child{ margin-bottom:0; }
.eco-chip b{ display:block; font-size:14px; color:var(--navy); margin-bottom:2px; }
.eco-chip span{ font-size:12.5px; color:var(--ink-soft); }

.mini-icon-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
@media (max-width:760px){ .mini-icon-grid{ grid-template-columns:repeat(2,1fr); } }
.mini-icon{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 14px; text-align:center; }
.mini-icon .ic{ margin-inline:auto; color:var(--navy); width:30px; height:30px; margin-bottom:12px; }
.mini-icon span{ font-size:13.5px; font-weight:600; }
.deliver-grid{ grid-template-columns:repeat(3,1fr); }
@media (max-width:760px){ .deliver-grid{ grid-template-columns:repeat(3,1fr); gap:10px; } }
@media (max-width:520px){
  .deliver-grid .mini-icon{ padding:16px 6px; }
  .deliver-grid .mini-icon .ic{ width:24px; height:24px; margin-bottom:8px; }
  .deliver-grid .mini-icon span{ font-size:10.5px; line-height:1.4; }
}

/* ---------- FACTORY ---------- */
.factory-visual{
  border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);
  background:linear-gradient(135deg,#eef3f8,#dde6f0);
  display:grid; place-items:center; padding:30px; margin-bottom:36px;
}
.factory-visual svg{ width:100%; max-width:560px; height:auto; }
.factory-cols{ display:grid; grid-template-columns:1.1fr .9fr; gap:40px; align-items:start; margin-bottom:40px; }
@media (max-width:860px){ .factory-cols{ grid-template-columns:1fr; } }

/* ---------- BRAND SECTIONS ---------- */
.brand-section{ border-top:1px solid var(--line); }
.brand-head{ display:flex; align-items:center; gap:18px; margin-bottom:20px; flex-wrap:wrap; }
.brand-logo-chip{
  display:block; height:44px; width:auto; padding:10px 22px;
  border-radius:10px; background:#fff; object-fit:contain;
}
.brand-tagline{ font-size:15px; color:var(--brand); font-weight:600; }
.brand-copy{ max-width:80ch; margin-bottom:34px; }
.brand-copy p{ margin-bottom:10px; color:var(--ink-soft); font-size:15px; }
.subhead{ font-size:14px; font-weight:700; color:var(--navy); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.subhead::before{ content:""; width:16px; height:2px; background:var(--brand); display:inline-block; }
.product-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:36px; }
@media (max-width:960px){ .product-grid{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:560px){ .product-grid{ grid-template-columns:repeat(2,1fr); } }
.product-item{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px 12px; text-align:center; }
.product-item .ic{ margin-inline:auto; color:var(--brand); width:28px; height:28px; margin-bottom:10px; }
.product-item span{ font-size:12.5px; font-weight:600; line-height:1.4; display:block; }
.strength-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
@media (max-width:900px){ .strength-row{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:560px){ .strength-row{ grid-template-columns:repeat(2,1fr); } }
.strength-item{ text-align:center; padding:18px 8px; }
.strength-diamond{ width:56px; height:56px; background:var(--brand); transform:rotate(45deg); border-radius:8px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.strength-diamond .ic{ transform:rotate(-45deg); color:#fff; width:24px; height:24px; }
.strength-item span{ font-size:12.5px; font-weight:600; }

/* ---------- SECTORS ---------- */
.sector-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:40px; }
@media (max-width:860px){ .sector-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .sector-grid{ grid-template-columns:1fr; } }
.sector-card{
  position:relative; overflow:hidden; background:linear-gradient(145deg,#fff 0%,#f7f9fc 100%);
  border:1px solid #dbe3ec; border-radius:14px; padding:22px; display:flex; gap:16px;
  align-items:flex-start; box-shadow:0 8px 20px rgba(10,58,92,.05); transition:border-color .2s, transform .2s, box-shadow .2s;
}
.sector-card:nth-child(1){ border-top:3px solid var(--orange); }
.sector-card:nth-child(2){ border-top:3px solid var(--blue2); }
.sector-card:nth-child(3){ border-top:3px solid var(--gold); }
.sector-card:nth-child(4){ border-top:3px solid #67a9d8; }
.sector-card:nth-child(5){ border-top:3px solid #8c78c7; }
.sector-card:nth-child(6){ border-top:3px solid #59a98a; }
.sector-card .ic-wrap{ width:46px; height:46px; border-radius:12px; background:#eaf1fb; display:flex; align-items:center; justify-content:center; flex:none; }
.sector-card .ic{ color:var(--navy); }
.sector-card h4{ font-size:15px; color:var(--navy); margin-bottom:6px; }
.sector-card p{ font-size:13px; color:var(--ink-soft); }
@media (max-width:560px){
  .sector-card{ padding:18px 14px; gap:12px; }
  .sector-card .ic-wrap{ width:40px; height:40px; }
  .sector-card p{ line-height:1.6; }
}

/* ---------- WHY US ---------- */
.why-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:40px; }
@media (max-width:860px){ .why-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .why-grid{ grid-template-columns:1fr; } }
.why-card{
  position:relative; overflow:hidden; background:#fff; border:1px solid #dbe3ec; border-radius:14px;
  padding:24px; box-shadow:0 8px 20px rgba(10,58,92,.05); transition:border-color .2s, transform .2s, box-shadow .2s;
}
.why-card:nth-child(1){ border-top:3px solid var(--orange); }
.why-card:nth-child(2){ border-top:3px solid var(--blue2); }
.why-card:nth-child(3){ border-top:3px solid var(--gold); }
.why-card:nth-child(4){ border-top:3px solid #67a9d8; }
.why-card:nth-child(5){ border-top:3px solid #8c78c7; }
.why-card:nth-child(6){ border-top:3px solid #59a98a; }
.why-card .ic-wrap{ width:48px; height:48px; border-radius:12px; background:#eef4fb; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.why-card:nth-child(odd) .ic-wrap{ background:#fff3e3; }
.why-card .ic{ color:var(--navy); }
.why-card h4{ font-size:15.5px; color:var(--navy); margin-bottom:4px; }
.why-card .eng{ font-size:12px; color:var(--orange); font-weight:600; margin-bottom:10px; display:block; }
.why-card p{ font-size:13.5px; color:var(--ink-soft); }
@media (max-width:560px){
  .why-card{ padding:18px 14px; }
  .why-card .ic-wrap{ width:42px; height:42px; margin-bottom:12px; }
  .why-card p{ line-height:1.6; }
}

/* ---------- CONTACT ---------- */
.loc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:44px; }
@media (max-width:900px){ .loc-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){
  .loc-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .loc-card{ padding:12px 7px; display:block; text-align:center; }
  .loc-card .ic{ width:20px; height:20px; margin:0 auto 6px; }
  .loc-card b{ font-size:10px; line-height:1.45; }
  .loc-card span{ font-size:9px; line-height:1.35; }
}
.loc-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; display:flex; gap:12px; align-items:flex-start; }
.loc-card .ic{ color:var(--orange); flex:none; margin-top:2px; }
.loc-card b{ display:block; font-size:13.5px; color:var(--navy); margin-bottom:2px; }
.loc-card span{ font-size:12px; color:var(--ink-soft); }

.contact-cols{ display:grid; grid-template-columns:1.1fr .8fr .8fr; gap:20px; }
@media (max-width:860px){ .contact-cols{ grid-template-columns:1fr; } }
.contact-box{ background:#0f335a; border-radius:var(--radius); padding:26px; }
.contact-box h4{ font-size:15px; margin-bottom:16px; color:#fff; }
.contact-line{ display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; color:#dfe8f2; }
.contact-line .ic{ width:18px; height:18px; color:var(--gold); flex:none; }
.social-row{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.social-row a{ width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
.qr-box{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:24px; text-align:center; }
.qr-box .ic-wrap{ width:52px; height:52px; border-radius:10px; background:#eaf1fb; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.qr-box .ic{ color:var(--navy); }
.qr-box h4{ font-size:14.5px; color:var(--navy); margin-bottom:8px; }
.qr-box p{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; }
.qr-deco{ width:110px; height:110px; margin:0 auto; background:
  repeating-linear-gradient(0deg, var(--navy) 0 4px, transparent 4px 8px),
  repeating-linear-gradient(90deg, var(--navy) 0 4px, transparent 4px 8px);
  background-blend-mode:multiply; opacity:.85; border-radius:4px;
}

.thanks-band{ text-align:center; padding-block:50px; background:var(--paper); border-top:1px solid var(--line); }
.thanks-band h3{ font-size:22px; color:var(--navy); margin-bottom:10px; }
.thanks-band p{ color:var(--ink-soft); font-size:14.5px; }

footer{ background:var(--navy-dark); color:#9fb2c6; padding-block:26px; font-size:13px; }
.footer-inner{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-inner a{ color:#c8d6e5; }

/* section number chip removed intentionally (content isn't a sequence) */

.section-divider{ height:1px; background:var(--line); border:none; margin:0; }

/* =====================================================
   MODERN LAYER: animated hero, banners, motion, reveals
===================================================== */
@keyframes floatA{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(30px,-24px) scale(1.06);} }
@keyframes floatB{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-26px,20px) scale(1.08);} }
@keyframes pulseGlow{ 0%,100%{ opacity:.55; filter:blur(0px);} 50%{ opacity:1; filter:blur(1px);} }
@keyframes flicker{ 0%,19%,21%,23%,54%,56%,100%{ opacity:1;} 20%,22%,55%{ opacity:.4;} }
@keyframes logoReveal{ 0%{ opacity:0; transform:translateY(18px) scale(.72) rotate(-8deg); filter:drop-shadow(0 0 0 rgba(252,185,45,0)); } 65%{ opacity:1; transform:translateY(-3px) scale(1.04) rotate(0deg); } 100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); filter:drop-shadow(0 10px 22px rgba(252,185,45,.2)); } }
@keyframes logoFloat{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-12px) rotate(1.5deg); } }
@keyframes bounceCue{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(8px);} }
@keyframes shine{ 0%{ background-position:-200% 0;} 100%{ background-position:200% 0;} }
@keyframes popIn{ 0%{ opacity:0; transform:translateY(16px) scale(.96);} 100%{ opacity:1; transform:translateY(0) scale(1);} }
@keyframes drift{ 0%{ transform:translateX(0);} 100%{ transform:translateX(-50%);} }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* header scroll state */
header{ transition:box-shadow .3s ease, background .3s ease; }
header.scrolled{ box-shadow:0 8px 24px rgba(0,0,0,.25); }
nav.main-nav a{ position:relative; }
nav.main-nav a[data-active="true"]{ color:#fff; }
nav.main-nav a[data-active="true"]::after{ content:""; position:absolute; inset-inline:0; bottom:-2px; height:2px; background:var(--gold); border-radius:2px; }

/* ---------- HERO 2.0 ---------- */
.hero{ min-height:92vh; display:flex; align-items:center; }
@media (max-width:860px){ .hero{ min-height:auto; padding-block:0; } }
@media (max-width:860px){
  .hero-inner{ padding-bottom:12px; }
  .section-alt{ border-top:0; padding-top:12px; }
}
.hero{ background:#fff; color:#111; }
.hero-diagonal{ background:#fff !important; }
.hero-diagonal svg,.hero-diagonal .blob{ display:none; }
.hero-copy h1{ color:#111; }
.hero-copy p{ color:#111; }
.hero-copy .eyebrow{ color:#111; }
.stat-chip{ background:#fff; border-color:#d7dce2; color:#111; }
.hero-diagonal{ background:
    radial-gradient(60% 55% at 18% 22%, rgba(232,98,44,.35), transparent 60%),
    radial-gradient(55% 50% at 82% 78%, rgba(47,95,168,.4), transparent 60%),
    linear-gradient(160deg,#123a63 0%, #071b30 70%);
}
.blob{ position:absolute; border-radius:50%; filter:blur(46px); pointer-events:none; }
.blob-1{ width:340px; height:340px; background:radial-gradient(circle,#f2a93b66,transparent 70%); top:-60px; inset-inline-start:-60px; animation:floatA 11s ease-in-out infinite; }
.blob-2{ width:280px; height:280px; background:radial-gradient(circle,#2f5fa877,transparent 70%); bottom:-40px; inset-inline-end:0; animation:floatB 13s ease-in-out infinite; }
.blob-3{ width:220px; height:220px; background:radial-gradient(circle,#e8622c55,transparent 70%); top:40%; inset-inline-start:38%; animation:floatA 9s ease-in-out infinite reverse; }

.hero-badge-wrap{ position:relative; top:24px; display:inline-flex; align-items:center; justify-content:center; background:url("./logo-high-resolution.png") center/contain no-repeat; }
.hero-badge-wrap::before{ content:none; }
.hero-badge{ position:relative; z-index:1; visibility:hidden; animation:logoReveal 1.1s cubic-bezier(.2,.8,.2,1) both, logoFloat 4.5s ease-in-out 1.1s infinite; }
.hero-badge-wrap{ animation:logoReveal 1.1s cubic-bezier(.2,.8,.2,1) both, logoFloat 4.5s ease-in-out 1.1s infinite; }
@media (prefers-reduced-motion:reduce){ .hero-badge,.hero-badge-wrap::before{ animation:none; } }

.hero-copy h1{ opacity:0; animation:popIn .8s ease .1s forwards; }
.hero-copy .eyebrow{ opacity:0; animation:popIn .7s ease 0s forwards; }
.hero-copy p{ opacity:0; animation:popIn .8s ease forwards; }
.hero-copy p:nth-of-type(1),.hero-copy p[data-en]:nth-of-type(1){ animation-delay:.25s; }
.hero-copy p:nth-of-type(2){ animation-delay:.4s; }
.hero-copy p:nth-of-type(3){ animation-delay:.55s; }
.hero-copy p:nth-of-type(4){ animation-delay:.6s; }

.hero-stats{ display:flex; gap:14px; flex-wrap:wrap; margin-top:26px; }
.stat-chip{
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); border-radius:999px;
  padding:9px 18px; font-size:13.5px; font-weight:600; color:#eaf1fb; display:flex; align-items:center; gap:8px;
  backdrop-filter:blur(4px);
}
.stat-chip b{ color:var(--gold); font-size:15px; }
.stat-chip{ background:#fff; border-color:#d7dce2; color:#111; }
@media (max-width:900px){
  .hero-stats{
    flex-wrap:nowrap;
    overflow:visible;
    justify-content:stretch;
    gap:6px;
    transform:none;
    padding-bottom:6px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .stat-chip{
    flex:1 1 0;
    min-width:0;
    justify-content:center;
    padding:7px 4px;
    font-size:10.5px;
    gap:4px;
  }
  .stat-chip .ic{ width:14px !important; height:14px !important; }
  .stat-chip b{ font-size:13px; }
  .stat-chip span{ white-space:nowrap; }
  .hero-stats .stat-chip:nth-child(1){ order:1; }
  .hero-stats .stat-chip:nth-child(2){ order:2; }
  .hero-stats .stat-chip:nth-child(3){ order:3; }
  .hero-stats .stat-chip:nth-child(4){ order:4; }
}
@media (max-width:380px){
  .hero-stats{ gap:2px; transform:none; }
  .stat-chip{ padding-inline:1px; font-size:8.5px; gap:2px; }
  .stat-chip b{ font-size:11px; }
  .stat-chip .ic{ width:11px !important; height:11px !important; }
}
}

.scroll-cue span{ width:26px; height:42px; border:2px solid rgba(255,255,255,.5); border-radius:14px; position:relative; display:block; }
