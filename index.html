<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة أنوار الثريا للتجارة | Anwaar Althuraya Trading Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a3a5c;
  --navy-dark:#052840;
  --navy-mid:#0f4d76;
  --orange:#f19323;
  --gold:#fcb92d;
  --red:#ee4947;
  --amber:#fcb92d;
  --blue2:#0d66ac;
  --ink:#1c2733;
  --ink-soft:#5b6a7a;
  --paper:#f6f8fa;
  --line:#e1e6ec;
  --white:#ffffff;
  --brand: var(--navy);
  --radius: 10px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
html[dir="ltr"] body{ font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif; }

/* language toggling */
body.lang-en [data-ar]{ display:none !important; }
body.lang-ar [data-en]{ display:none !important; }

h1,h2,h3,h4{ margin:0; font-weight:700; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
img{max-width:100%;display:block;}

.wrap{ max-width:1180px; margin-inline:auto; padding-inline:24px; }
.ic{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; display:block; }

.mini-icon-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
@media (max-width:760px){ .mini-icon-grid{ grid-template-columns:repeat(2,1fr); } }
.mini-icon{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px 14px; text-align:center; }
.mini-icon .ic{ margin-inline:auto; color:var(--navy); width:30px; height:30px; margin-bottom:12px; }
.mini-icon span{ font-size:13.5px; font-weight:600; }

.sectors-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (max-width:760px){
  .sectors-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
}
@media (max-width:520px){
  .sectors-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
    align-items:stretch;
  }
  .sectors-grid .mini-icon{
    min-width:0;
    min-height:132px;
    padding:18px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .sectors-grid .mini-icon .ic{
    width:22px;
    height:22px;
    margin-bottom:10px;
  }
  .sectors-grid .mini-icon span{
    font-size:11px;
    line-height:1.55;
    white-space:normal;
    text-align:center;
  }
}
</style>
</head>
<body class="lang-ar">
  <div class="wrap">
    <div class="subhead"><span data-ar>مجالات الأعمال</span><span data-en>Our Business Sectors</span></div>
    <div class="mini-icon-grid sectors-grid">
      <div class="mini-icon"><svg class="ic"><use href="#i-bulb"/></svg><span data-ar>الإنارة</span><span data-en>Lighting</span></div>
      <div class="mini-icon"><svg class="ic"><use href="#i-bolt"/></svg><span data-ar>الأدوات الكهربائية</span><span data-en>Electrical Products</span></div>
      <div class="mini-icon"><svg class="ic"><use href="#i-droplet"/></svg><span data-ar>السباكة والأدوات الصحية</span><span data-en>Plumbing & Sanitary Ware</span></div>
      <div class="mini-icon"><svg class="ic"><use href="#i-brick"/></svg><span data-ar>مواد البناء</span><span data-en>Building Materials</span></div>
      <div class="mini-icon"><svg class="ic"><use href="#i-helmet"/></svg><span data-ar>حلول المشاريع والتوريد</span><span data-en>Projects & Supply Solutions</span></div>
      <div class="mini-icon"><svg class="ic"><use href="#i-store"/></svg><span data-ar>التوزيع وقنوات البيع</span><span data-en>Distribution & Sales</span></div>
    </div>
  </div>
</body>
</html>
