<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كتالوج المنتجات</title>
  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; background:#f2f6fa; color:#0b2a4a; font-family:Tahoma,Arial,sans-serif; }
    header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px clamp(16px,4vw,40px); background:#0b2a4a; color:#fff; }
    h1{ margin:0; font-size:18px; }
    a{ color:#0b2a4a; background:#fff; border-radius:999px; padding:9px 14px; font-size:13px; font-weight:700; text-decoration:none; }
    iframe{ display:block; width:100%; height:calc(100vh - 62px); border:0; }
  </style>
</head>
<body>
  <header>
    <h1 id="catalogTitle">كتالوج المنتجات</h1>
    <a id="downloadLink" download>تحميل PDF</a>
  </header>
  <iframe id="catalogFrame" title="كتالوج المنتجات"></iframe>
  <script>
    (function(){
      var catalogs = {
        'weiju-catalog.pdf': 'كتالوج WEIJU',
        'bfco-catalog.pdf': 'كتالوج BFCO',
        'luxgen-catalog.pdf': 'كتالوج LUXGEN',
        'over-light-catalog.pdf': 'كتالوج OVER LIGHT',
        'catalog-qr-guide.pdf': 'دليل الكتالوجات'
      };
      var file = new URLSearchParams(location.search).get('file');
      if(!catalogs[file]){
        document.body.innerHTML = '<header><h1>الكتالوج غير متاح</h1></header>';
        return;
      }
      document.title = catalogs[file];
      document.getElementById('catalogTitle').textContent = catalogs[file];
      document.getElementById('catalogFrame').src = file;
      document.getElementById('downloadLink').href = file;
    }());
  </script>
</body>
</html>
